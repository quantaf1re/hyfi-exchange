[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

solc = "0.8.36"
optimizer = true
optimizer_runs = 1000000

remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@openzeppelin-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@uniswap/universal-router/=lib/universal-router/",
    "permit2/=lib/v4-periphery/lib/permit2/",
    "@uniswap/v4-hooks-public/=lib/v4-hooks-public/src/",
    "@protocol-fees/=lib/v4-hooks-public/lib/protocol-fees/src/",
    # Force v4-hooks-public (and its protocol-fees dep) to compile against our lib copies
    # so shared types (PoolKey, Currency, ...) are identical across the project
    "lib/v4-hooks-public/:@uniswap/v4-core/=lib/v4-core/",
    "lib/v4-hooks-public/:@uniswap/v4-periphery/=lib/v4-periphery/",
    "lib/v4-hooks-public/:@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "lib/v4-hooks-public/:v4-core/=lib/v4-core/src/",
]

[rpc_endpoints]
eth = "${MAINNET_RPC_URL}"
matic = "${POLYGON_RPC_URL}"
base = "${RPC_URL_BASE}"
robin = "${RPC_URL_ROBIN}"